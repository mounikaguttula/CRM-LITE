<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- 🛡️ Global 3rd-Party reCAPTCHA Timeout Shield -->
    <script>
      (function() {
        function isRecaptchaError(errObj, msg, url) {
          var str = String(msg || '') + ' ' + String(url || '') + ' ' + String(errObj || '');
          if (errObj && errObj.message) str += ' ' + String(errObj.message);
          if (errObj && errObj.stack) str += ' ' + String(errObj.stack);
          return (
            str.indexOf('reCAPTCHA') !== -1 ||
            str.indexOf('recaptcha') !== -1 ||
            str.indexOf('gstatic.com') !== -1
          );
        }

        var origOnError = window.onerror;
        window.onerror = function(msg, url, line, col, error) {
          if (isRecaptchaError(error, msg, url)) {
            console.warn('[reCAPTCHA Shield] Intercepted 3rd-party reCAPTCHA timeout:', msg);
            return true;
          }
          if (typeof origOnError === 'function') {
            return origOnError.apply(this, arguments);
          }
          return false;
        };

        window.addEventListener('error', function(event) {
          if (isRecaptchaError(event.error, event.message, event.filename)) {
            console.warn('[reCAPTCHA Shield] Suppressed error event:', event.message);
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event && event.reason;
          var reasonStr = String(reason && (reason.message || reason.stack || reason) || '');
          if (isRecaptchaError(reason, reasonStr, '')) {
            console.warn('[reCAPTCHA Shield] Intercepted 3rd-party reCAPTCHA promise rejection:', reasonStr);
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="description" content="CRM Lite — Metadata-Driven Enterprise SaaS" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will

      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>CRM Lite — Metadata-Driven Enterprise SaaS</title>
  </head>
